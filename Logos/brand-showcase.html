<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">

    <title>Brand Showcase Portfolio</title>
    <link rel="icon" href="../Assets/fav/Fav.svg" type="image/x-icon">

    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/base-grid-card.css">
    <link rel="stylesheet" href="../Styles/branding.css">
    <link rel="stylesheet" href="../Styles/section-footer.css">
    <link rel="stylesheet" href="../Styles/transitions.css">

    <style>
        html {
            margin-top: 30px;
            background-color: rgba(0, 0, 0, 0.9) !important;
        }

        .body {
            margin-top: 30px;
            max-width: 910px;
            width: 60%;
            margin: 0 auto;
            background-color: transparent;
        }

        #dynamic-gallery {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        #dynamic-gallery img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .body {
                width: 97%;
            }
        }
    </style>
</head>


<body class="body is-transitioning">

    <!-- Navigation Transition Overlay -->
    <div id="transition-overlay">
        <div class="loader-content">
            <img src="../Assets/fav/Logo.svg" alt="MohJeha Logo" class="loader-logo">
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- IMAGES -->
    <section class="container" style="border-top: 2px solid var(--3); border-radius: 20px; overflow: hidden;">
        <div id="dynamic-gallery"></div>

        <script>
            const galleryContainer = document.getElementById('dynamic-gallery');

            // Parse brand parameter from URL (default to "Brand" if unspecified)
            const urlParams = new URLSearchParams(window.location.search);
            const brandParam = urlParams.get('brand') || 'Brand';

            // Brand registry with exact disk folders and presentation images
            const BRAND_REGISTRY = {
                "Brand": {
                    folder: "Brand",
                    logo: "Brand_logo.webp",
                    images: [
                        "Brand (1).webp", "Brand (2).webp", "Brand (3).webp", "Brand (4).webp",
                        "Brand (5).webp", "Brand (6).webp", "Brand (7).webp", "Brand (8).webp", "Brand (9).webp"
                    ]
                },
                "DigitalWorld": {
                    folder: "DigitalWorld",
                    logo: "DigitalWorld_logo.webp",
                    images: ["DigitalWorld_Stack.webp", "DigitalWorld_Thumb.webp"]
                },
                "Dabbous": {
                    folder: "Dabbous",
                    logo: "Dabbous_logo.webp",
                    images: ["Dabbous_Stack.webp", "Dabbous_Thumb.webp"]
                },
                "Atelier": {
                    folder: "Atelier",
                    logo: "Atelier_logo.webp",
                    images: ["Atelier_Stack.webp", "Atelier_Thumb.webp"]
                },
                "Arz": {
                    folder: "Arz",
                    logo: "Arz_logo.webp",
                    images: ["Arz (1).webp", "Arz (2).webp", "Arz (3).webp", "Arz (4).webp"]
                },
                "SIS": {
                    folder: "SIS",
                    logo: "SIS_logo.webp",
                    images: ["SIS_Thumb.webp"]
                },
                "EarthLinks": {
                    folder: "EarthLinks",
                    logo: "EarthLinks_logo.webp",
                    images: ["EarthLinks_Thumb.webp"]
                },
                "AbuSalah": {
                    folder: "AbuSalah",
                    logo: "Abusalah_logo.webp",
                    images: ["Abusalah_Thumb.webp"]
                },
                "Abusalah": {
                    folder: "AbuSalah",
                    logo: "Abusalah_logo.webp",
                    images: ["Abusalah_Thumb.webp"]
                },
                "BirlesikZirve": {
                    folder: "BirlesikZirve",
                    logo: "BirlesikZirve_logo.webp",
                    images: ["Birlesik Zirve_Thumb.webp"]
                },
                "ibnbalad": {
                    folder: "ibnbalad",
                    logo: "ibnbalad_logo.webp",
                    images: ["ibnbalad_Thumb.webp"]
                },
                "Lebaniz": {
                    folder: "Lebaniz",
                    logo: "Lebaniz_logo.webp",
                    images: ["Lebaniz_Thumb.webp"]
                },
                "NanoStitch": {
                    folder: "NanoStitch",
                    logo: "NanoStitch_logo.webp",
                    images: ["invoice.webp"]
                },
                "Nova": {
                    folder: "Nova",
                    logo: "Nova_logo.webp",
                    images: ["Nova_Thumb.webp"]
                },
                "Sirius": {
                    folder: "Sirius",
                    logo: "Sirius_logo.webp",
                    images: ["Sirius_Thumb.webp"]
                },
                "Summer": {
                    folder: "SummerLive",
                    logo: "Summer_logo.webp",
                    images: ["Summer_Thumb.webp"]
                },
                "SummerLive": {
                    folder: "SummerLive",
                    logo: "Summer_logo.webp",
                    images: ["Summer_Thumb.webp"]
                },
                "Vistamar": {
                    folder: "Vistamar",
                    logo: "vistamar_logo.webp",
                    images: ["vistamar_Thumb.webp"]
                },
                "vistamar": {
                    folder: "Vistamar",
                    logo: "vistamar_logo.webp",
                    images: ["vistamar_Thumb.webp"]
                }
            };

            const brandData = BRAND_REGISTRY[brandParam] || {
                folder: brandParam,
                logo: `${brandParam}_logo.webp`,
                images: []
            };

            const folderPath = `../Assets/Graphics/Logos/${brandData.folder}/`;

            // Prepare list of images to render
            const imagesToRender = [];

            // Add logo if available
            if (brandData.logo) {
                imagesToRender.push(`${folderPath}${encodeURI(brandData.logo)}`);
            }

            // Add specific brand images
            if (brandData.images && brandData.images.length > 0) {
                brandData.images.forEach(img => {
                    imagesToRender.push(`${folderPath}${encodeURI(img)}`);
                });
            }

            // Render images directly into gallery
            imagesToRender.forEach((src, idx) => {
                const displayImg = document.createElement('img');
                displayImg.src = src;
                displayImg.alt = `${brandParam} Presentation ${idx + 1}`;
                displayImg.loading = idx === 0 ? 'eager' : 'lazy';
                galleryContainer.appendChild(displayImg);
            });
        </script>


        <div class="closing">
            <img src="../Assets/fav/Fav.svg" alt="Logo" class="logo">
            <p>Like what you see?</p>
            <p>Let's build the next brand that stands out<br>and stands for something meaningful.</p>
        </div>

    </section>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.19/dist/lenis.min.js"></script>
    <script src="../js/lenis.js"></script>

    <script src="page.js"></script>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === "Escape") {
                window.parent.postMessage('closeOverlay', '*');
            }
        });
    </script>

    <!-- Page Transitions -->
    <script src="../Js/transitions.js"></script>

</body>

</html>
