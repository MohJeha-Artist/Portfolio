<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Graphics</title>

    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/section-hero.css">
    <link rel="stylesheet" href="../Styles/section-footer.css">

    <style>
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .Video-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px 0;
            transition: all 1s ease;
        }  

        @media (max-width: 768px) {
            .Video-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .Vid-thumbnail {
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .Vid-thumbnail:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .Vid-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-title {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #c40707;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 1280px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 720px;
            border: none;
        }

        @media (max-width: 768px) {
            iframe {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <section class="container">
        <h1>Motion Graphics Showcase</h1>
        <div class="Video-grid">
            <div class="Vid-thumbnail" onclick="openVideo('13OKyJ43pFo6jGH-4AmCMHiJw3WT9Kq7z')">
                <img src="../Assets/Thumbnails/Video_Frisky (1).jpg" alt="Video 1">
                <div class="thumbnail-title">Project 1</div>
            </div>
            <div class="Vid-thumbnail" onclick="openVideo('13JLTVOaF68tdJNWxZO1pT3I7msXvVvVS')">
                <img src="../Assets/Thumbnails/Video_Frisky (2).jpg" alt="Video 2">
                <div class="thumbnail-title">Project 2</div>
            </div>
            <div class="Vid-thumbnail" onclick="openVideo('13JkywTsvNjXHhy8KkXBUGcRfUudRDNS8')">
                <img src="../Assets/Thumbnails/Video_Frisky (3).jpg" alt="Video 3">
                <div class="thumbnail-title">Project 3</div>
            </div>
            <div class="Vid-thumbnail" onclick="openVideo('13SAMY1LUJLyQA7gI_Uzb2fq5U7zT1rZn')">
                <img src="../Assets/Thumbnails/Video_Frisky (4).jpg" alt="Video 4">
                <div class="thumbnail-title">Project 4</div>
            </div>
        </div>
    </section>

    <!-- Overlay -->
    <div class="overlay" id="videoOverlay" onclick="closeVideo(event)">
        <div class="video-container" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeVideo(event)">&times;</button>
            <iframe id="videoFrame" allowfullscreen allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        function openVideo(videoId) {
            const overlay = document.getElementById('videoOverlay');
            const frame = document.getElementById('videoFrame');
            frame.src = `https://drive.google.com/file/d/${videoId}/preview`;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeVideo(e) {
            const overlay = document.getElementById('videoOverlay');
            const frame = document.getElementById('videoFrame');
            overlay.style.display = 'none';
            frame.src = '';
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideo();
        });
    </script>
</body>
</html>
