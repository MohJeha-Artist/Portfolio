<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">

    <title id="page-title">3D Projects Showcase</title>
    <link rel="icon" href="../Assets/fav/Fav.svg" type="image/x-icon">

    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/base-grid-card.css">
    <link rel="stylesheet" href="../Styles/section-hero.css">
    <link rel="stylesheet" href="../Styles/section-3dwork.css">
    <link rel="stylesheet" href="../Styles/section-footer.css">
    <link rel="stylesheet" href="../Styles/transitions.css">

    <style>
        html {
            margin-top: 30px;
            background-color: rgba(0, 0, 0, 0.9) !important;
        }

        .body {
            margin-top: 30px;
            max-width: 910px;
            width: 60%;
            margin: 0 auto;
            background-color: transparent;
        }

        .sketchfab-embed-wrapper {
            width: 100%;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sketchfab-embed-wrapper iframe {
            width: 100%;
            height: 480px;
            display: block;
        }

        @media (max-width: 768px) {
            .body {
                width: 97%;
            }

            .sketchfab-embed-wrapper iframe {
                height: 320px;
            }
        }
    </style>
</head>

<body class="body is-transitioning">

    <!-- Navigation Transition Overlay -->
    <div id="transition-overlay">
        <div class="loader-content">
            <img src="../Assets/fav/Logo.svg" alt="MohJeha Logo" class="loader-logo">
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- TOP BAR -->
    <section class="container" style="height: 50px; margin: 0 auto;">
        <div class="hero-top-bar" style="top: 0;">
            <a href="../index.html">
                <img class="Hero-logo" src="../Assets/fav/Logo.svg" alt="hero-image" id="home">
            </a>

            <div class="social-icons">
                <a href="https://www.facebook.com/mohjeha1" target="_blank" class="scl-icon">
                    <img src="../Assets/fav/fb.svg" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/mohjeha_/" target="_blank" class="scl-icon">
                    <img src="../Assets/fav/ins.svg" alt="Instagram">
                </a>
                <a href="https://www.linkedin.com/in/mohjeha/" target="_blank" class="scl-icon">
                    <img src="../Assets/fav/linked.svg" alt="LinkedIn">
                </a>
            </div>
        </div>
    </section>

    <!-- ----- LOAD Hero SECTIONS ----- -->
    <section class="HERO banner" style="width: 100%;" id="Top">
        <div class="Image-Container screen">
            <img class="Hero-Image" src="../Assets/Thumbnails/3D_Axe_thumbnail.webp" alt="hero-image" id="hero-img">
        </div>

        <div style="position: absolute; bottom: 40%;">
            <div class="subhead upper wrap shadow" id="Hero-name">Hero Asset</div>
            <div class="head upper wrap shadow" id="Hero-head">3D Project</div>
        </div>
    </section>

    <!-- IMAGES GALLERY -->
    <section class="container" style="border-top: 2px solid var(--3); border-radius: 20px;">
        <div id="dynamic-gallery"></div>
    </section>

    <!-- Embed Sketchfab Viewer -->
    <div class="sketchfab-embed-wrapper" id="sketchfab-container" style="display: none;">
        <iframe id="sketchfab-frame" title="3D Model Viewer" frameborder="0" allowfullscreen mozallowfullscreen="true"
            webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking
            execution-while-out-of-viewport execution-while-not-rendered web-share src="">
        </iframe>
    </div>

    <!-- BUTTONS -->
    <section class="container">
        <div class="buttons">
            <a class="side-btn-pg" id="prev">
                <svg class="side-btn" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 12h14M5 12l4-4m-4 4 4 4" />
                </svg> <span>Previous</span>
            </a>

            <a class="side-btn-pg" id="next">
                <svg class="side-btn" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 12H5m14 0-4 4m4-4-4-4" />
                </svg> <span>Next</span>
            </a>

            <a class="side-btn-pg" href="../index.html">
                <svg class="side-btn" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m4 12 8-8 8 8M6 10.5V19a1 1 0 0 0 1 1h3v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h3a1 1 0 0 0 1-1v-8.5" />
                </svg>
                <span>Home</span>
            </a>
        </div>
    </section>

    <section class="spacer" style="height:50px;"></section>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
        <p class="copyrights">&copy; <span id="current-year"></span> MohJeha-Artist. All Rights Reserved.</p>
        <div class="footer-content">
            <div class="ft-b"><img src="../Assets/fav/3d-art-designer.svg" alt="Logo" class="footer-logo"></div>
            <div class="ft-b">
                <div class="social-icons">
                    <a href="https://www.facebook.com/mohjeha1" target="_blank" class="scl-icon">
                        <img src="../Assets/fav/fb.svg" alt="Facebook">
                    </a>
                    <a href="https://www.instagram.com/mohjeha_/" target="_blank" class="scl-icon">
                        <img src="../Assets/fav/ins.svg" alt="Instagram">
                    </a>
                    <a href="https://www.linkedin.com/in/mohjeha/" target="_blank" class="scl-icon">
                        <img src="../Assets/fav/linked.svg" alt="LinkedIn">
                    </a>

                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" class="arrowback"
                        viewBox="0 0 16 16"
                        onclick="document.getElementById('Top').scrollIntoView({ behavior: 'smooth' })">
                        <path fill-rule="evenodd"
                            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z" />
                    </svg>
                </div>
            </div>
        </div>
    </footer>

    <!-- Load 3D Project Master Registry Data -->
    <script src="../Js/data/projects-data.js"></script>

    <!-- Dynamic Showcase Controller Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectKey = urlParams.get('project') || 'Axe';
            const categoryParam = urlParams.get('category');

            const allProjects = (typeof PROJECTS_DATA !== 'undefined') ? PROJECTS_DATA : ((typeof PROJECTS_3D !== 'undefined') ? PROJECTS_3D : {});
            const project = allProjects[projectKey] || null;

            let folderPath = project ? project.folder : null;
            if (!folderPath) {
                const cat = categoryParam || 'melee';
                folderPath = `Assets/3DProjects/${cat}/${projectKey}/`;
            }
            if (!folderPath.endsWith('/')) folderPath += '/';

            const localFolder = `../${folderPath}`;
            const title = (project && project.title) || projectKey;
            const subtitle = (project && (project.subtitle || project.category)) || "3D Project";
            const sketchfabId = project ? project.sketchfabId : null;

            // 1. Page Title & Headings
            document.title = `3D Projects - ${title}`;
            const titleEl = document.getElementById('page-title');
            if (titleEl) titleEl.innerText = `3D Projects - ${title}`;

            const heroName = document.getElementById('Hero-name');
            if (heroName) heroName.innerText = subtitle;

            const heroHead = document.getElementById('Hero-head');
            if (heroHead) heroHead.innerText = title;

            // 2. Cover / Hero Image Loading
            const heroImg = document.getElementById('hero-img');
            if (heroImg) {
                heroImg.src = `${localFolder}${projectKey}_Cover.webp`;
                heroImg.alt = title;
                heroImg.onerror = () => {
                    heroImg.src = `${localFolder}${projectKey}_thumb.webp`;
                };
            }

            // 3. Dynamic Renders
            const galleryContainer = document.getElementById('dynamic-gallery');
            if (galleryContainer) {
                galleryContainer.innerHTML = '';
                const maxRenders = (project && typeof project.rendersCount === 'number') ? project.rendersCount : 5;

                for (let i = 1; i <= maxRenders; i++) {
                    const img = document.createElement('img');
                    img.src = `${localFolder}${projectKey}(${i}).webp`;
                    img.alt = `${title} Render ${i}`;
                    img.setAttribute('width', '100%');
                    img.loading = 'lazy';
                    img.onerror = function () {
                        this.remove();
                    };
                    galleryContainer.appendChild(img);
                }
            }

            // 4. Sketchfab 3D Embed
            const sketchfabContainer = document.getElementById('sketchfab-container');
            const sketchfabFrame = document.getElementById('sketchfab-frame');
            if (sketchfabId && sketchfabContainer && sketchfabFrame) {
                sketchfabFrame.src = `https://sketchfab.com/models/${sketchfabId}/embed?preload=1&ui_hint=0&ui_theme=dark&dnt=1`;
                sketchfabFrame.title = title;
                sketchfabContainer.style.display = 'block';
            } else if (sketchfabContainer) {
                sketchfabContainer.style.display = 'none';
            }

            // 5. Next & Previous Project Navigation
            const keys = Object.keys(allProjects);
            const currentIndex = keys.indexOf(projectKey);
            const prevBtn = document.getElementById('prev');
            const nextBtn = document.getElementById('next');

            if (prevBtn && nextBtn && currentIndex !== -1 && keys.length > 1) {
                const prevIdx = (currentIndex > 0) ? currentIndex - 1 : keys.length - 1;
                const nextIdx = (currentIndex < keys.length - 1) ? currentIndex + 1 : 0;
                prevBtn.href = `projects-showcase.html?project=${encodeURIComponent(keys[prevIdx])}`;
                nextBtn.href = `projects-showcase.html?project=${encodeURIComponent(keys[nextIdx])}`;
            }
        });
    </script>

    <!-- LENIS SMOOTH SCROLL -->
    <script src="https://unpkg.com/lenis@1.1.19/dist/lenis.min.js"></script>
    <script src="../Js/lenis.js"></script>

    <script>
        // ESC key and Close overlay handling
        document.addEventListener('keydown', function (e) {
            if (e.key === "Escape") {
                window.parent.postMessage('closeOverlay', '*');
            }
        });
        document.querySelectorAll('a[href*="index.html"]').forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.self !== window.top) {
                    e.preventDefault();
                    window.parent.postMessage('closeOverlay', '*');
                }
            });
        });
    </script>

    <script src="../Js/transitions.js"></script>

</body>

</html>
