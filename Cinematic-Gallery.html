<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Showcase | MohJeha Artist</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-color: #e0aaff; /* Subtle lavender/silver accent */
            --transition-speed: 0.7s;
            --easing: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .showcase-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 8%;
            gap: 4rem;
            position: relative;
        }

        /* Ambient Background */
        .showcase-section::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(224, 170, 255, 0.05) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Left Content */
        .content-left {
            flex: 1;
            max-width: 450px;
            z-index: 1;
        }

        .content-left h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-left p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 90%;
        }

        .explore-btn {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .explore-btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        /* Right Side: Video Gallery */
        .video-gallery {
            flex: 2;
            display: flex;
            height: 600px;
            gap: 15px;
            z-index: 1;
        }

        .video-card {
            position: relative;
            flex: 1;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            transition: flex var(--transition-speed) var(--easing), transform 0.4s ease;
            cursor: pointer;
            filter: grayscale(0.4) brightness(0.7);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 40%);
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .video-card:hover {
            flex: 2.15; /* Mathematically tuned for ~9:16 aspect ratio relative to 600px height */
            filter: grayscale(0) brightness(1);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(224, 170, 255, 0.15);
        }

        .video-card:hover::after {
            opacity: 0;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .video-card.is-playing video {
            opacity: 1;
        }

        .video-card .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        .video-card.is-playing .poster-img {
            opacity: 0;
        }

        .video-label {
            position: absolute;
            bottom: 2rem;
            left: 1.5rem;
            z-index: 2;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s var(--easing) 0.2s;
            pointer-events: none;
        }

        .video-card:hover .video-label {
            opacity: 1;
            transform: translateY(0);
        }

        .video-label h3 {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.2rem;
        }

        .video-label span {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .showcase-section {
                flex-direction: column;
                padding: 6rem 5%;
                gap: 3rem;
            }
            .content-left {
                max-width: 100%;
                text-align: center;
            }
            .content-left p {
                margin-inline: auto;
            }
            .video-gallery {
                width: 100%;
                height: 500px;
            }
        }

        @media (max-width: 600px) {
            .video-gallery {
                height: 400px;
                gap: 8px;
            }
            .video-card:hover {
                flex: 8;
            }
            .video-label h3 { font-size: 0.9rem; }
        }

        /* --- Cinematic Video Modal --- */
        .video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s var(--easing);
            padding: 2rem;
        }

        .video-modal.is-active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 100px rgba(224, 170, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.6s var(--easing);
            position: relative;
        }

        .video-modal.is-active .modal-container {
            transform: scale(1);
        }

        .modal-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2100;
        }

        .modal-close:hover {
            background: white;
            color: black;
            transform: rotate(90deg);
        }

        .modal-close svg {
            width: 24px;
            height: 24px;
        }

        @media (max-width: 768px) {
            .video-modal { padding: 1rem; }
            .modal-close { top: 1rem; right: 1rem; width: 40px; height: 40px; }
        }

        /* Standalone Card Constraints */
.video-card-standalone {
    width: 200px; /* Matches the baseline un-hovered width of the gallery cards */
    height: 600px; /* Keeps the cinematic vertical look */
    margin: 2rem auto; /* Optional: centers it on the page with some spacing */
}

/* Overriding the hover expansion for standalone mode */
.video-card-standalone:hover {
    width: 337px; /* Mathematically simulates the exact 2.15 flex expansion (~9:16 aspect ratio) */
}

/* Responsive updates for the standalone card */
@media (max-width: 1024px) {
    .video-card-standalone {
        height: 500px;
        width: 180px;
    }
    .video-card-standalone:hover {
        width: 280px;
    }
}

@media (max-width: 600px) {
    .video-card-standalone {
        height: 400px;
        width: 150px;
    }
    .video-card-standalone:hover {
        width: 225px;
    }
}
    </style>
</head>
<body>

    <section class="showcase-section">
        <div class="content-left">
            <h1>Visual<br>Motion</h1>
            <p>Capturing the essence of movement through cinematic storytelling and high-fidelity motion graphics. A collection of selected vertical narratives.</p>
            <a href="#" class="explore-btn">View All Works</a>
        </div>

        <div class="video-gallery">
            <!-- Video Card 1 -->
            <div class="video-card" data-video-id="13OKyJ43pFo6jGH-4AmCMHiJw3WT9Kq7z">
                <img src="Assets/Thumbnails/Video_Frisky (1).jpg" class="poster-img" alt="Dynamics Poster">

                </video>

            <!-- Video Card 3 -->
            <div class="video-card" data-video-id="1NJCuWvPGtnj1Tl5AhiVoAc4qy73zsc1q">

    <!-- Standalone Video Card -->
<div class="video-card video-card-standalone" data-video-id="13OKyJ43pFo6jGH-4AmCMHiJw3WT9Kq7z">
    <img src="Assets/Thumbnails/Video_Frisky (1).jpg" class="poster-img" alt="Dynamics Poster">
    <video muted loop playsinline preload="metadata">
        <source src="Assets/Media/ShowCase_Frisky_Apples.mp4" type="video/mp4">
    </video>
    <div class="video-label">
        <h3>Dynamics</h3>
        <span>Featured Project</span>
    </div>
</div>


    <!-- Cinematic Modal -->
    <div class="video-modal" id="videoModal">
        <button class="modal-close" id="closeModal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
        </button>
        <div class="modal-container">
            <iframe id="modalIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoCards = document.querySelectorAll('.video-card');
            const videoModal = document.getElementById('videoModal');
            const modalIframe = document.getElementById('modalIframe');
            const closeModal = document.getElementById('closeModal');

            // Modal Logic
            const openVideoModal = (id) => {
                modalIframe.src = `https://drive.google.com/file/d/${id}/preview`;
                videoModal.classList.add('is-active');
                document.body.style.overflow = 'hidden';
            };

            const closeVideoModal = () => {
                videoModal.classList.remove('is-active');
                setTimeout(() => {
                    modalIframe.src = '';
                    document.body.style.overflow = '';
                }, 500);
            };

            videoCards.forEach(card => {
                const video = card.querySelector('video');
                const videoId = card.getAttribute('data-video-id');

                // Hover Interaction
                card.addEventListener('mouseenter', () => {
                    card.classList.add('is-playing');
                    
                    const playVideo = () => {
                        // Only set random time if not already playing or paused mid-way
                        if (video.paused) {
                            const randomTime = Math.random() * video.duration;
                            video.currentTime = isFinite(randomTime) ? randomTime : 0;
                            video.play().catch(e => console.warn("Playback failed:", e));
                        }
                    };

                    if (video.readyState >= 3) {
                        playVideo();
                    } else {
                        video.load(); // Ensure it starts loading
                        video.addEventListener('canplay', playVideo, { once: true });
                    }
                });

                card.addEventListener('mouseleave', () => {
                    card.classList.remove('is-playing');
                    video.pause();
                });

                // Click Interaction
                card.addEventListener('click', () => {
                    if (videoId) openVideoModal(videoId);
                });
            });

            // Close Events
            closeModal.addEventListener('click', closeVideoModal);
            videoModal.addEventListener('click', (e) => {
                if (e.target === videoModal) closeVideoModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && videoModal.classList.contains('is-active')) closeVideoModal();
            });
        });
    </script>
</body>
</html>
